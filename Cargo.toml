[package]
name = "syncerting-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
ksni = "0.3.6"
open = "5.4.1"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "process"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["json", "rustls", "http2"]

[profile.release]
lto = true
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
