[package]
name = "syncerting-tray"
version = "0.1.0"
description = "A Syncthing tray application for KDE Plasma"
license = "Apache-2.0"
repository = "https://github.com/growse/syncerting-tray"
readme = "README.md"
keywords = ["syncthing", "tray", "kde", "plasma", "statusnotifieritem"]
categories = ["command-line-utilities"]
edition = "2024"
# The tray reads its artwork with include_str!, so the SVG has to travel with
# the crate; target/ and the scratch preview output must not.
include = ["src/**/*", "resources/**/*", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
dirs = "6.0.0"
ksni = "0.3.6"
open = "5.4.1"
resvg = "0.48"
roxmltree = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "process"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["json", "rustls", "http2"]

[profile.release]
lto = true
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "rt-multi-thread", "macros"] }
